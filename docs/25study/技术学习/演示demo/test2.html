    <style>
        /* 连接控制区域样式 */
        .connection-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Consolas", "Courier New", monospace;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            color: #0a0e27;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(45deg, #00ffff, #0066cc);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff00ff, #880088);
            color: white;
        }

        /* 制音标识样式 */
        .mute-icon {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(138, 43, 226, 0.8);
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(138, 43, 226, 0.6),
                0 0 10px rgba(138, 43, 226, 0.5);
        }

        .mute-icon::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(138, 43, 226, 0.6);
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(138, 43, 226, 0.4);
        }

        .big-fret.active .mute-icon {
            border-color: rgba(255, 0, 255, 1);
            box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.8),
                0 0 15px rgba(255, 0, 255, 0.7);
        }

        .big-fret.active .mute-icon::before {
            border-color: rgba(255, 0, 255, 0.8);
            box-shadow: inset 0 0 8px rgba(255, 0, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(45deg, #ff00ff, #660066);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            animation: pulseStatus 2s infinite;
        }

        .status-disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        @keyframes pulseStatus {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .connection-status {
            font-family: "Consolas", "Courier New", monospace;
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 5px #00ffff;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 6px;
            backdrop-filter: blur(5px);
        }

        /* 按键基础样式 - 增强3D */
        .fret {
            position: relative;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 1px solid rgba(0, 255, 255, 0.1);
            background: rgba(15, 23, 41, 0.3);
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
            overflow: hidden;
            transform-origin: center center;
        }

        .fret-item-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .pressure-progress-bar {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .pressure-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            transition: width 0.2s ease;
            border-radius: 2px;
        }

        .fret:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.3),
                0 0 15px rgba(0, 255, 255, 0.5);

        }

        /* active时的3D凹陷效果 */
        .fret.active::before {
            opacity: 0.2;
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.6) 0%,
                    transparent 100%);
        }

        .fret.active .fret-item-box {
            transform: translateZ(10px);
            background: linear-gradient(207deg, rgba(217, 217, 217, 0.3) 12.1%, rgb(255, 255, 255) 135.78%);
            stroke-width: 0.5px;
            stroke: rgb(255, 255, 255);
            filter: drop-shadow(rgba(255, 255, 255, 0.25) 0px 2px 4px);
        }

        .fret.active::after {
            opacity: 1;
            background: linear-gradient(0deg,
                    rgba(0, 0, 0, 0.8) 0%,
                    transparent 100%);
        }

        /* 大按键37 */
        .fret.big-fret {
            grid-column: 13;
            grid-row: 1 / 4;
            border-radius: 4px;
            border: 0.3px solid rgba(181, 181, 181, 0.50);
            opacity: 0.4;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.20) -84.31%, #000 159.15%);
        }

        .fret.big-fret .mute-img {
            position: absolute;

            width: 12px;
            height: 12px;
        }

        .fret.big-fret .fret-number {
            font-size: 28px;
        }

        /* 第14列容器 */
        .column-14 {
            grid-column: 14;
            grid-row: 1 / 4;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 255, 255, 0.1);
            padding: 6px 2px 6px 2px;
            /* gap: 8px; */

        .small-fret {
            width: 72px;
            height: 12px;
            /* flex: 0 0 auto; */

            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 120, 180, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

            border: 0.5px solid rgba(181, 181, 181, 0.50);

            background: linear-gradient(180deg, rgba(0, 0, 0, 0.20) -84.31%, #000 159.15%);

            opacity: 0.2;
            background: linear-gradient(180deg,

                    transparent 100%);

        /* 按键编号 */
        .fret-number {
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 12px;
            color: #00ffff;
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
            text-shadow: 0 0 5px #00ffff, 0 0 10px rgba(0, 255, 255, 0.5);
            font-family: "Consolas", "Courier New", monospace;
            transition: all 0.3s ease;
        }

        /* 按压力度指示器 */
        .pressure-indicator {
            position: absolute;
            bottom: 5px;
            right: 8px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
            font-family: "Consolas", "Courier New", monospace;
            transition: all 0.3s ease;
        }

        /* 横向琴弦线 */
        .string-line {
            position: absolute;
            left: 0;
            height: 2px;
            width: 81.22%;
            background: linear-gradient(to right,
                    transparent,
                    #00ffff,
                    transparent);
            box-shadow: 0 0 5px #00ffff, 0 0 10px rgba(0, 255, 255, 0.5);
            pointer-events: none;
            z-index: 5;
        }

        .string-line:nth-child(1) {
            top: 33.33%;
        }

        .string-line:nth-child(2) {
            top: 66.66%;
        }

        /* 纵向品格线 */
        .fret-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom,
                    transparent,
                    #00ffff,
                    transparent);
            box-shadow: 0 0 5px #00ffff, 0 0 10px rgba(0, 255, 255, 0.5);
            pointer-events: none;
            z-index: 5;
        }

        .indicator :nth-of-type(1) {
            /* 第一个indicator样式 - 扁长条形 */
            width: 40px;
            height: 6px;
            flex-shrink: 0;
            border-radius: 3px;
            border: 1px solid #999999;
            background: linear-gradient(90deg, #666666 0%, #888888 100%);
        }

        /* 激活状态的扁长条样式 */
        .indicator.active :nth-of-type(1) {
            background: linear-gradient(90deg, #00bfff 0%, #4682b4 100%);
            border-color: #00bfff;
            box-shadow: 0 0 8px rgba(0, 191, 255, 0.6);
        }

        .indicator:nth-of-type(2),
        .indicator:nth-of-type(4),
        .indicator:nth-of-type(7),
        .indicator:nth-of-type(9),
        .indicator :nth-of-type(11) {
            /* width: 2px;

        .indicator:nth-of-type(4) .indicator-dot,
        .indicator:nth-of-type(7) .indicator-dot,
        .indicator:nth-of-type(9) .indicator-dot,
        .indicator:nth-of-type(11) .indicator-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            border: 1px solid #b5b5b5;
            background: #7b7b7b;
        }

        .indicator:nth-of-type(1).active .indicator-line {
            background: #e5506e;
            border: none;
            box-shadow: none;
        }

        .indicator:nth-of-type(1).active .indicator-line::before {
            content: '';
            position: absolute;
            /* top: -30px; */
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background-image: url('light-1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .indicator:nth-of-type(2).active .indicator-dot::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background-image: url('light-2.png');
            background-size: contain;
            background-repeat: no-repeat;

    <script>
        new Vue({
            el: "#app",
            data: {
                isConnected: false,
                serialManager: null,
                chordIndicatorData: [], // 存储和弦垫指示灯数据
                // 43个格子的状态数据
                frets: Array.from({ length: 44 }, function (_, i) {
                    return {
                        id: i,
                        pressure: 0,
                    };
                }),
            },
            mounted: function () {
                this.initSerial();
            },
            methods: {
                // 获取和弦垫指示灯状态
                getChordIndicatorState: function (indicatorIndex) {
                    // 检查是否有任何匹配的索引在chordIndicatorData中
                    // 1,13,25... 对应 indicatorIndex=1
                    // 2,14,26... 对应 indicatorIndex=2
                    // ...
                    // 12,24,36... 对应 indicatorIndex=12
                    // 37-43范围内的索引不处理
                    return this.chordIndicatorData.some(function (itemIndex) {
                        // 排除37-43范围的索引
                        if (itemIndex >= 37 && itemIndex <= 43) {
                            return false;
                        }
                        // 计算索引相对于12的位置，12对应余数0，需要特殊处理
                        var remainder = itemIndex % 12;
                        return remainder === 0
                            ? indicatorIndex === 12
                            : remainder === indicatorIndex;
                    });
                },

                // 获取fret-item-box的样式，实现向内倾斜效果
                getFretItemBoxStyle: function (index) {
                    // 只要有pressure值就固定向内倾斜5度，并加深阴影
                    var pressure = this.frets[index].pressure;
                    if (pressure <= 0) return {};

                    // 固定倾斜5度
                    var tiltAmount = 5;

                    // 简化实现：统一向内倾斜，通过不同的transform-origin实现各个方向的向内效果
                    var column = index % 12 || 12;
                    var row = Math.ceil(index / 12);

                    // 根据位置设置不同的transform-origin来实现真正的"向内"效果
                    var transformOrigin = '';

                    // 确定水平方向的原点位置
                    var horizontalOrigin = column <= 6 ? 'right' : 'left';
                    // 确定垂直方向的原点位置
                    var verticalOrigin = row <= 2 ? 'bottom' : 'top';

                    transformOrigin = horizontalOrigin + ' ' + verticalOrigin;

                    // 根据位置确定旋转方向，实现真正的向内效果
                    var rotateX = 0;
                    var rotateY = 0;

                    // 垂直方向旋转：上半部分向下压，下半部分向上压
                    if (row <= 2) {
                        rotateX = tiltAmount; // 上半部分向下压
                    } else {
                        rotateX = -tiltAmount; // 下半部分向上压
                    }

                    // 水平方向旋转：左半部分向右压，右半部分向左压
                    if (column <= 6) {
                        rotateY = tiltAmount; // 左半部分向右压
                    } else {
                        rotateY = -tiltAmount; // 右半部分向左压
                    }

                    return {
                        transform: 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)',
                        transformOrigin: transformOrigin,
                        boxShadow: 'inset 0 0 15px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3)'
                    };
                },

                // 初始化串口
                initSerial: function () {
                    var self = this;
                    this.serialManager = new SerialManager();

                    this.serialManager.onConnect(function () {
                        self.isConnected = true;
                    });

                    this.serialManager.onDisconnect(function () {
                        self.isConnected = false;
                        // 清空所有格子状态
                        self.frets.forEach(function (fret) {
                            fret.pressure = 0;
                        });
                    });

                    this.serialManager.onData(function (result) {
                        self.handleReceivedData(result);
                    });

                    this.serialManager.onError(function (error) {
                        console.error("串口错误:", error.message);
                    });

                    // 监听批量数据事件
                    window.addEventListener("batchData", function (e) {
                        var batch = e.detail;
                        var fingerstyleData =
                            batch && batch.data && batch.data.fingerstyle
                                ? batch.data.fingerstyle
                                : [];
                        self.updateFretboardFromData(fingerstyleData);
                    });
                },

                // 连接串口
                connectSerial: function () {
                    if (this.serialManager && this.serialManager.isSupported()) {
                        this.serialManager.connect({ baudRate: 3000000 });
                    } else {
                        alert("浏览器不支持Web Serial API，请使用Chrome 89+或Edge 89+");
                    }
                },

                // 断开串口
                disconnectSerial: function () {
                    if (this.serialManager) {
                        this.serialManager.disconnect();
                    }
                },

                // 处理接收到的数据
                handleReceivedData: function (result) {
                    window.dispatchEvent(
                        new CustomEvent("batchData", { detail: result })
                    );
                },

                // 更新指板数据
                updateFretboardFromData: function (fingerstyleData) {
                    var self = this;
                    if (!Array.isArray(fingerstyleData)) return;

                    // 先清空所有格子
                    this.frets.forEach(function (fret) {
                        fret.pressure = 0;
                    });

                    // 清空和弦垫指示灯数据
                    this.chordIndicatorData = [];

                    // 更新有数据的格子
                    fingerstyleData.forEach(function (item) {
                        if (item && item.index && item.dynamics > 0) {
                            var index = item.index;
                            // 将有数据的索引添加到和弦垫指示灯数据中
                            self.chordIndicatorData.push(index);

                            // 只有在有效范围内的索引才更新指板格子状态
                            if (index >= 1 && index <= 43) {
                                Vue.set(self.frets[index], "pressure", item.dynamics);
                            }
                        }
                    });
                },

                // 判断是否为窄列
                isNarrowColumn: function (n) {
                    return [2, 4, 7, 9, 11].indexOf(n) !== -1;
                },

                // 获取格子的动态样式（根据压力值）- 反向缩放版本
                getFretStyle: function (index) {
                    var pressure = this.frets[index] ? this.frets[index].pressure : 0;

                    if (pressure === 0) {
                        return {};
                    }

                    // 标准化压力值 (0-100)
                    var normalizedPressure = Math.min(100, Math.max(0, pressure));

                    // 【关键修改】反向缩放逻辑
                    // pressure 20 → scale 0.8 (缩小到80%)
                    // pressure 50 → scale 0.5 (缩小到50%)
                    // pressure 80 → scale 0.2 (缩小到20%)
                    // pressure 100 → scale 0.6 (保留最小60%，防止完全消失)
                    var scale = Math.max(0.6, 1 - normalizedPressure / 100);

                    // 使用压力强度计算其他效果
                    var intensity = Math.pow(normalizedPressure / 100, 0.6);

                    // Z轴位移 - 模拟按压深度（越大陷得越深）
                    var translateZ = -intensity * 25;

                    // 旋转角度增强立体感
                    var rotateX = intensity * 3;

                    // 计算径向渐变 - 中心凹陷效果
                    var gradientIntensity = 0.5 + intensity * 0.5;
                    var gradientRadius = 10 + intensity * 90;

                    // 【增强】多层内阴影 - 模拟深度凹陷
                    var insetShadows = [
                        // 顶部暗影（按压感）
                        "inset 0 " +
                        (5 + intensity * 20) +
                        "px " +
                        (25 + intensity * 60) +
                        "px rgba(0, 0, 0, " +
                        (0.6 + intensity * 0.4) +
                        ")",
                        // 中心深色区域
                        "inset 0 0 " +
                        (40 + intensity * 100) +
                        "px rgba(138, 43, 226, " +
                        (0.6 + intensity * 0.4) +
                        ")",
                        // 整体暗化
                        "inset 0 0 " +
                        (60 + intensity * 120) +
                        "px rgba(0, 0, 0, " +
                        (0.5 + intensity * 0.5) +
                        ")",
                        // 底部反光
                        "inset 0 " +
                        (-3 - intensity * 8) +
                        "px " +
                        (15 + intensity * 25) +
                        "px rgba(138, 43, 226, " +
                        intensity * 0.4 +
                        ")",
                        // 边缘暗化
                        "inset 0 0 " +
                        (20 + intensity * 50) +

                    // 边框变化（格子缩小时边框变粗）
                    var borderWidth = 1 + intensity * 4;
                    var borderOpacity = 0.7 + intensity * 0.3;

                        transition: "all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)",

                },

                // 获取压力值文字的样式
                getPressureTextStyle: function (index) {
                    var pressure = this.frets[index] ? this.frets[index].pressure : 0;
                    var normalizedPressure = Math.min(100, Math.max(0, pressure));
                    var intensity = Math.pow(normalizedPressure / 100, 0.6);

                    // 颜色渐变：绿色 → 黄色 → 红白色
                    var red = Math.floor(100 + 155 * intensity);
                    var green = Math.floor(255 - 100 * intensity);
                    var blue = Math.floor(100 + 100 * intensity);

                    // 发光强度增强
                    var glowSize1 = 12 + intensity * 30;
                    var glowSize2 = 25 + intensity * 50;

                    return {
                        color: "rgb(" + red + ", " + green + ", " + blue + ")",
                        textShadow:
                            "0 0 " +
                            glowSize1 +
                            "px rgb(" +
                            red +
                            ", " +
                            green +
                            ", " +
                            blue +
                            "), 0 0 " +
                            glowSize2 +
                            "px rgba(" +
                            red +
                            ", " +
                            green +
                            ", " +
                            blue +
                            ", 0.9)",
                    };
